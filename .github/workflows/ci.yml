name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ── 네이티브 빌드 + 테스트 ─────────────────────────────────────────────────
  test:
    name: Test (native)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The native job builds --all-targets (debug) AND --release in one `target/`, on top of a
      # restored cache; on a stock ubuntu-latest (~14 GB free on /) that has run the runner out of
      # disk ("No space left on device"). Drop large preinstalled SDKs we never use to free ~25 GB.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
          df -h /

      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libudev-dev libxkbcommon-dev \
            libwayland-dev libx11-dev pkg-config \
            pulseaudio libasound2-plugins

      # A virtual sound card, so the audio halves of the selftests actually RUN here instead of
      # skipping. "Audio is outside CI entirely" had been a standing risk since v0.140 — every audio
      # claim rested on one developer's local device, and the selftests that guard those claims
      # (beat_crawler's metered flurry, survivor's drive curve, audio_reactive's meters) opted out
      # with exit 0 on every CI run.
      #
      # rodio opens a device through cpal, which enumerates ALSA — so a null sink is only half of it;
      # ALSA's *default* PCM has to be routed into PulseAudio too, which is what libasound2-plugins
      # provides and .asoundrc selects.
      #
      # PULSE_LATENCY_MSEC is load-bearing, and was measured rather than guessed. With the default
      # (multi-second) buffer, rodio pulls seconds of audio in one burst and then idles; the level
      # tap publishes during the burst and goes STALE in the gap, so `levels()` decays to zero
      # between bursts. Checks that sample over seconds ride it out — beat_crawler passed, finding
      # 16 kicks in a real mix — while sub-second deadlines land in the gaps: audio_reactive read
      # rms 0.0000 against a 1200 ms rise deadline and survivor's 600 ms watchdog engaged. A small
      # buffer makes rodio poll continuously, which is what a real card does.
      #
      # `snd-dummy` would be the closer analogue to real hardware, but it is NOT available: the
      # runner's azure kernel ships no such module (`modprobe: FATAL: Module snd-dummy not found in
      # /lib/modules/6.17.0-1020-azure`), even with linux-modules-extra installed.
      - name: Provision a virtual sound card (PulseAudio null sink)
        run: |
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink \
            sink_name=SelfTest sink_properties=device.description=SelfTest
          pactl set-default-sink SelfTest
          printf 'pcm.!default { type pulse }\nctl.!default { type pulse }\n' > "$HOME/.asoundrc"
          pactl info

      - name: Install Rust 1.95
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test --all-targets
        run: cargo test --all-targets

      # --all-targets skips doctests; run them so fork-facing doc examples can't rot.
      - name: cargo test --doc
        run: cargo test --doc

      # The `<NAME>_SELFTEST` acceptance tests. Each was proven non-vacuous by sabotage when it was
      # written, and then nothing ran them again — no CI step and no verify.sh step invoked one.
      #
      # SKELETON_REQUIRE_AUDIO=1 makes an audio-device skip a FAILURE, because the step above is
      # supposed to have provided one. Without it a null sink that silently failed to come up would
      # skip the audio checks and report success — the same trap the script exists to close, one
      # level up. Same principle as the render job's SKELETON_REQUIRE_GPU=1.
      - name: cargo run --example <NAME>_SELFTEST (acceptance tests)
        env:
          SKELETON_REQUIRE_AUDIO: "1"
          # Keep the device buffer small so the level tap is polled continuously — see the sound
          # card step above for the measurements that make this load-bearing.
          PULSE_LATENCY_MSEC: "30"
        run: ./scripts/selftests.sh

      - name: cargo build (release)
        run: cargo build --release

  # ── GPU 렌더 테스트 (소프트웨어 GPU: Mesa lavapipe) ─────────────────────────
  # CI has no GPU, so the engine's render path was never exercised here — only by local macOS
  # shell smokes. This job installs Mesa's software Vulkan driver (lavapipe) so wgpu gets a CPU
  # adapter and `tests/render.rs` renders the real path headlessly. `SKELETON_REQUIRE_GPU=1` makes
  # a missing/unselected adapter a HARD failure (never a silent green skip), and the marker grep is
  # an independent second guard that the job actually rendered. See docs/RENDER_TESTING.md.
  render:
    name: Render tests (lavapipe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build + Vulkan software (lavapipe) deps
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libudev-dev libxkbcommon-dev \
            libwayland-dev libx11-dev pkg-config \
            mesa-vulkan-drivers libvulkan1 vulkan-tools

      # The lavapipe ICD filename varies across Mesa versions (lvp_icd.x86_64.json vs lvp_icd.json),
      # so glob it rather than hardcoding. The engine calls a raw `instance.request_adapter` with
      # `Backends::all()` (it does NOT honor WGPU_BACKEND/WGPU_ADAPTER_NAME), so the adapter must be
      # constrained at the Vulkan-loader level here. No GL software driver is installed, so lavapipe
      # is the only adapter wgpu can pick. No xvfb needed — the headless path is surfaceless.
      - name: Select the lavapipe ICD
        run: |
          icd="$(echo /usr/share/vulkan/icd.d/lvp_icd*.json)"
          echo "VK_ICD_FILENAMES=$icd" >> "$GITHUB_ENV"
          echo "selected ICD: $icd"

      - name: Vulkan sanity — lavapipe (llvmpipe) must enumerate
        run: vulkaninfo --summary | grep -i llvmpipe

      - name: Install Rust 1.95
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-render-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-render-

      # SKELETON_REQUIRE_GPU=1 → "no adapter" panics instead of skipping; the grep then confirms a
      # real render happened. Both must pass, so the render path can never silently go unverified.
      - name: Render tests — must actually render, never silently skip
        env:
          SKELETON_REQUIRE_GPU: "1"
        run: |
          set -o pipefail
          cargo test --test render -- --nocapture 2>&1 | tee render.log
          grep -q '\[render-test\] adapter=' render.log

  # ── WASM 빌드 ─────────────────────────────────────────────────────────────
  wasm:
    name: Build (WASM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.95 + wasm32 target
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: wasm32-unknown-unknown
          components: clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-wasm-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-wasm-

      - name: cargo build --target wasm32-unknown-unknown
        run: cargo build --target wasm32-unknown-unknown

      - name: cargo clippy (wasm, lib only)
        run: cargo clippy --target wasm32-unknown-unknown --lib -- -D warnings

      # The build above is lib + bins, so an example's wasm path was invisible to CI and CLAUDE.md
      # had to ask contributors to build it by hand. This names the examples that carry a
      # `#[wasm_bindgen]` entry point — the ones an index.html actually calls — and builds those.
      # A blanket --examples cannot work: the native-only examples fail to compile for wasm on
      # purpose (hot-reload, headless screenshots, servers, physics, GPU particles).
      - name: cargo build (wasm examples)
        run: ./scripts/build_wasm_examples.sh

  # ── Windows 빌드 ──────────────────────────────────────────────────────────
  # The other jobs are ubuntu/wasm only, so nothing here ever compiled the DX12
  # backend. That let a dependency conflict hide: an audio stack pulling an older
  # `windows` crate than wgpu-hal's makes `gpu-allocator` hand DX12 types from the
  # wrong version and wgpu-hal fails to build. It is invisible on macOS/Linux and
  # only surfaces when someone packages a Windows release.
  windows:
    name: Build (Windows / DX12)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.95
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-msvc-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-msvc-

      # A single `windows` version across the graph is the actual invariant; assert it
      # directly so a future dependency bump fails here with a readable message rather
      # than as a wall of D3D12 type mismatches inside wgpu-hal.
      - name: One `windows` crate version on the MSVC target
        shell: bash
        run: |
          # `cargo tree -i` exits non-zero when the spec is ambiguous (i.e. exactly the
          # failure we are testing for), so swallow the status and judge by the output.
          versions=$(cargo tree --target x86_64-pc-windows-msvc -i windows 2>&1 \
            | grep -oE '^windows v[0-9.]+|windows@[0-9.]+' | sort -u || true)
          echo "$versions"
          if [ "$(printf '%s\n' "$versions" | grep -c .)" -ne 1 ]; then
            echo "::error::multiple 'windows' crate versions on the MSVC target — DX12 will not compile"
            exit 1
          fi

      - name: cargo build (lib + bins)
        run: cargo build

  # ── 문서 빌드 ─────────────────────────────────────────────────────────────
  docs:
    name: Rustdoc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libudev-dev libxkbcommon-dev \
            libwayland-dev libx11-dev pkg-config

      - name: Install Rust 1.95
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-docs-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-docs-

      - name: cargo doc --no-deps
        run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps

  package:
    name: Package dry-run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libudev-dev libxkbcommon-dev \
            libwayland-dev libx11-dev pkg-config

      - name: Install Rust 1.95
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-package-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-package-

      - name: cargo package --locked --list
        run: cargo package --locked --list

      - name: cargo package --locked
        run: cargo package --locked

      - name: cargo publish --dry-run --locked
        run: cargo publish --dry-run --locked
