name: CI

# ⚠️ The `push: [main]` run looks like pure duplication and is NOT. Do not remove it.
#
# It re-tests a tree that has already passed: a squash-merge from an up-to-date branch produces the
# same tree the PR was built from (verified on #421 — both `323199e4`), and `main` is protected with
# required checks, `strict`, and `enforce_admins`, so nothing arrives unverified anyway. On that
# reasoning it was nearly deleted.
#
# ⚠️ The required set is every job in this file — SEVEN since 2026-08-19, when deleting the
# examples tree removed `Browser smokes (Chrome + swiftshader)`. **A required check for a job that
# no longer exists can never report, so a PR waits on it forever.** If the query below still lists
# browser smokes, branch protection has not been updated yet and every merge is blocked:
#   gh api repos/ChunSam/skeleton-engine/branches/main/protection \
#     --jq '.required_status_checks.contexts'
# Read the real list, never this comment. It claimed SEVEN and "browser smokes is NOT among them"
# from 2026-08-08 to 2026-08-18 while the API said otherwise — deleting a job is exactly the moment
# that drift gets reintroduced.
#
# What that reasoning misses is **cache scope**. GitHub isolates caches by ref: a `pull_request` run
# writes into the PR's own scope, readable only inside that PR, while every branch can read caches
# written on the default branch. So the `push: [main]` run is the only thing that populates the
# cache the *next* PR restores from. Measured: all ten surviving entries are `refs/heads/main`;
# not one was written by a PR run. Delete this trigger and every PR starts cold.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# One run per branch. Pushing a fixup while CI is still going used to leave both runs going to
# completion — measured on the v0.143.10 branch, two full runs four minutes apart, both red.
#
# PR runs only. A `main` run must never be cancelled: it is the one that writes the shared cache
# above, and killing it mid-flight would leave the next PR to rebuild from nothing.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ── 잡 타임아웃 ────────────────────────────────────────────────────────────
  # Every job carries an explicit `timeout-minutes`. GitHub's default is 360, and on
  # 2026-08-18 two runners wedged inside `apt-get` on the very first dependency step and
  # sat there producing no output — the same apt script had already succeeded in `test`
  # and `docs` on the same run, so it was the runner, not the script. Without a timeout
  # the PR would have waited four hours for a red that told it nothing.
  #
  # Sized at roughly 3x the slowest cold-cache run observed: test 10m11s, windows 4m25s,
  # wasm 3m00s, render 2m44s, docs 2m19s, macos 2m11s. These are hang detectors, not
  # performance budgets — raise one if real work grows into it rather than trimming the
  # work to fit. (Those numbers predate the examples-tree deletion, so every job is now
  # faster than measured; they are kept as upper bounds rather than re-measured.)

  # ── 네이티브 빌드 + 테스트 ─────────────────────────────────────────────────
  test:
    name: Test (native)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # The native job builds --all-targets (debug) AND --release in one `target/`, on top of a
      # restored cache. That once ran the runner out of disk ("No space left on device"), so this
      # step used to `rm -rf` ~25 GB of preinstalled SDKs at a cost of ~63 s — 11% of the job.
      #
      # Both halves of that premise expired. v0.143.13 replaced the whole-`target/` cache with a
      # pruned one, and the runner image grew: the last cleanup run measured 145 GB on `/` with
      # 108 GB free *after* the delete, so ~83 GB stands without it. The two builds come nowhere
      # near that. The `df` stays as a ~1 s canary — it is the number that decides whether the
      # cleanup ever has to come back, and it is what this removal was gated on in the first place.
      #
      # `nproc` was added for a question the examples-tree deletion closed by removing its subject:
      # the selftest step's example build swung 152-292 s across runs with an identical cache key,
      # and runner core count was the leading suspect. The selftest step is back as of phase 0, but
      # its example build is NOT — there are no games yet, so the step compiles nothing. The
      # question reopens when phase 1 lands, and these two lines are what it will be answered with.
      - name: Runner capacity
        run: |
          df -h /
          echo "nproc=$(nproc)"
          free -g | head -2

      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libudev-dev libxkbcommon-dev \
            libwayland-dev libx11-dev pkg-config

      - name: Install Rust 1.95
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy, rustfmt

      # `Swatinem/rust-cache` rather than a raw `actions/cache` over `target/`.
      #
      # The raw version cached the WHOLE `target/`, which made this job's cache the largest in the
      # repo — and it is also the slowest job, so it saved last. The five fast jobs filled the
      # repo's 10 GB cache budget first and this one was evicted as LRU every single time. Measured
      # on run 30884878663: `Cache not found for input keys: Linux-cargo-<hash>, Linux-cargo-` —
      # the prefix fallback found nothing either, because no `Linux-cargo-*` entry existed at all.
      # So the job rebuilt from zero every run AND spent 221 s (22% of its wall time) writing a
      # cache that was thrown away before the next one.
      #
      # This action caches dependency artifacts and prunes the workspace's own, which is exactly
      # the part that changes every commit and made the cache huge. It also keys per job and per
      # toolchain by itself, so the six hand-written keys below are gone.
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test --all-targets
        run: cargo test --all-targets

      # --all-targets skips doctests; run them so fork-facing doc examples can't rot.
      - name: cargo test --doc
        run: cargo test --doc

      # The `<NAME>_SELFTEST` acceptance tests, restored 2026-08-19 as phase 0 of the examples
      # rebuild (plans/2026-08-19-examples-rebuild-plan.md). It is here BEFORE the first rebuilt
      # game on purpose: the deleted tree shipped 22 games against 11 selftests because the runner
      # arrived last, and a gate that cannot see the gap will not close it. Until phase 1 lands this
      # step is a loud no-op; the moment `examples/<name>/<name>.rs` appears it fails unless that
      # game carries a selftest, and then runs it.
      #
      # The device-free halves run fine here; the audio halves skip (no sound card), which the
      # script tolerates while treating every OTHER skip as a failure. Same principle as the render
      # job's SKELETON_REQUIRE_GPU — an environment opt-out must never read as a green pass.
      #
      # This is a STEP in an existing job, so branch protection is untouched. Restoring a whole job
      # (phase 5's `wasm-smokes`) is the case that needs its required context re-added.
      - name: Acceptance tests (<NAME>_SELFTEST)
        run: ./scripts/selftests.sh

      - name: cargo build (release)
        run: cargo build --release

  # ── GPU 렌더 테스트 (소프트웨어 GPU: Mesa lavapipe) ─────────────────────────
  # CI has no GPU, so the engine's render path was never exercised here — only by local macOS
  # shell smokes (deleted with the examples tree they drove; `tests/render.rs` is now the whole of
  # it). This job installs Mesa's software Vulkan driver (lavapipe) so wgpu gets a CPU
  # adapter and `tests/render.rs` renders the real path headlessly. `SKELETON_REQUIRE_GPU=1` makes
  # a missing/unselected adapter a HARD failure (never a silent green skip), and the marker grep is
  # an independent second guard that the job actually rendered. See docs/RENDER_TESTING.md.
  render:
    name: Render tests (lavapipe)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install build + Vulkan software (lavapipe) deps
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libudev-dev libxkbcommon-dev \
            libwayland-dev libx11-dev pkg-config \
            mesa-vulkan-drivers libvulkan1 vulkan-tools

      # The lavapipe ICD filename varies across Mesa versions (lvp_icd.x86_64.json vs lvp_icd.json),
      # so glob it rather than hardcoding. The engine calls a raw `instance.request_adapter` with
      # `Backends::all()` (it does NOT honor WGPU_BACKEND/WGPU_ADAPTER_NAME), so the adapter must be
      # constrained at the Vulkan-loader level here. No GL software driver is installed, so lavapipe
      # is the only adapter wgpu can pick. No xvfb needed — the headless path is surfaceless.
      - name: Select the lavapipe ICD
        run: |
          icd="$(echo /usr/share/vulkan/icd.d/lvp_icd*.json)"
          echo "VK_ICD_FILENAMES=$icd" >> "$GITHUB_ENV"
          echo "selected ICD: $icd"

      - name: Vulkan sanity — lavapipe (llvmpipe) must enumerate
        run: vulkaninfo --summary | grep -i llvmpipe

      - name: Install Rust 1.95
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # SKELETON_REQUIRE_GPU=1 → "no adapter" panics instead of skipping; the grep then confirms a
      # real render happened. Both must pass, so the render path can never silently go unverified.
      - name: Render tests — must actually render, never silently skip
        env:
          SKELETON_REQUIRE_GPU: "1"
        run: |
          set -o pipefail
          cargo test --test render -- --nocapture 2>&1 | tee render.log
          grep -q '\[render-test\] adapter=' render.log

  # ── WASM 빌드 ─────────────────────────────────────────────────────────────
  wasm:
    name: Build (WASM)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.95 + wasm32 target
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: wasm32-unknown-unknown
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo build --target wasm32-unknown-unknown
        run: cargo build --target wasm32-unknown-unknown

      # A STEP in this existing job, not a new job — so branch protection is untouched (adding a
      # job without its required context is a check nobody is gated on). The lib build above does
      # not cover examples; this builds every game that does not declare itself native-only, and
      # fails on a stale declaration too.
      - name: Example games build for wasm
        run: ./scripts/build_wasm_examples.sh

      - name: cargo clippy (wasm, lib only)
        run: cargo clippy --target wasm32-unknown-unknown --lib -- -D warnings

  # ── Windows 빌드 ──────────────────────────────────────────────────────────
  # The other jobs are ubuntu/wasm only, so nothing here ever compiled the DX12
  # backend. That let a dependency conflict hide: an audio stack pulling an older
  # `windows` crate than wgpu-hal's makes `gpu-allocator` hand DX12 types from the
  # wrong version and wgpu-hal fails to build. It is invisible on macOS/Linux and
  # only surfaces when someone packages a Windows release.
  windows:
    name: Build (Windows / DX12)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.95
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # A single `windows` version across the graph is the actual invariant; assert it
      # directly so a future dependency bump fails here with a readable message rather
      # than as a wall of D3D12 type mismatches inside wgpu-hal.
      - name: One `windows` crate version on the MSVC target
        shell: bash
        run: |
          # `cargo tree -i` exits non-zero when the spec is ambiguous (i.e. exactly the
          # failure we are testing for), so swallow the status and judge by the output.
          versions=$(cargo tree --target x86_64-pc-windows-msvc -i windows 2>&1 \
            | grep -oE '^windows v[0-9.]+|windows@[0-9.]+' | sort -u || true)
          echo "$versions"
          if [ "$(printf '%s\n' "$versions" | grep -c .)" -ne 1 ]; then
            echo "::error::multiple 'windows' crate versions on the MSVC target — DX12 will not compile"
            exit 1
          fi

      - name: cargo build (lib + bins)
        run: cargo build

  # ── macOS 빌드 ────────────────────────────────────────────────────────────
  # Same argument as the Windows job above, applied to the other platform nobody was compiling.
  # Until this existed, `src/input/gamepad_macos.rs` — 142 lines — and seven `target_os = "macos"`
  # branches across `app.rs`, `app/window.rs`, `input/mod.rs` and `input/gamepad.rs` were built by
  # exactly one thing: somebody remembering to do it locally, as CLAUDE.md asks.
  #
  # That backend is not decorative. gilrs (IOKit-HID) cannot read modern Xbox/PS5 pads on macOS
  # because Apple's GameController framework claims them, so macOS runs an entirely separate gamepad
  # path (`app.rs`'s own comment says so). A compile error in it is invisible everywhere else.
  #
  # Build only, deliberately — matching the Windows job. Gamepads, audio playback and windowed
  # playtest still need a real machine, and a runner cannot stand in for one; the question this job
  # answers is only "do the macOS branches still compile".
  macos:
    name: Build (macOS / Metal)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.95
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo build (lib + bins)
        run: cargo build

  # ── 문서 빌드 ─────────────────────────────────────────────────────────────
  docs:
    name: Rustdoc
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libudev-dev libxkbcommon-dev \
            libwayland-dev libx11-dev pkg-config

      - name: Install Rust 1.95
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo doc --no-deps
        run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps

  package:
    name: Package dry-run
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libudev-dev libxkbcommon-dev \
            libwayland-dev libx11-dev pkg-config

      - name: Install Rust 1.95
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo package --locked --list
        run: cargo package --locked --list

      - name: cargo package --locked
        run: cargo package --locked

      - name: cargo publish --dry-run --locked
        run: cargo publish --dry-run --locked
