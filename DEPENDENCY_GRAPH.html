<title>skeleton-engine — 모듈 의존 그래프</title>
<style>

  --ground:#EAEDF3; --surface:#F8F9FC; --surface-2:#DFE4EE; --sunk:#E2E6EF;
  --ink:#11131B; --ink-2:#454C60; --ink-3:#6D7589;
  --line:#CFD5E2; --line-2:#BAC2D4;
  --accent:#1B5EA8; --accent-2:#0E4C8F; --accent-soft:#D8E6F7;
  --edge:#8C97B2; --canvas:#F1F3F8;
  --out:#1B5EA8; --in:#B03A78;

  --shadow:0 1px 2px rgba(17,19,27,.06), 0 8px 24px -16px rgba(17,19,27,.24);
}

  :root{

    --c-core:#6680FF; --c-render:#FF6E6E; --c-ui:#FFA64D;
    --c-gameplay:#4DE68A; --c-data:#B37DFF; --c-platform:#4DE0F0;
    --shadow:0 1px 2px rgba(0,0,0,.5), 0 10px 30px -18px rgba(0,0,0,.9);
  }
}
:root[data-theme="light"]{
  --ground:#EAEDF3; --surface:#F8F9FC; --surface-2:#DFE4EE; --sunk:#E2E6EF;
  --ink:#11131B; --ink-2:#454C60; --ink-3:#6D7589;
  --line:#CFD5E2; --line-2:#BAC2D4;
  --accent:#1B5EA8; --accent-2:#0E4C8F; --accent-soft:#D8E6F7;
  --edge:#8C97B2; --canvas:#F1F3F8; --out:#1B5EA8; --in:#B03A78;
  --c-core:#2F4FD0; --c-render:#C4383F; --c-ui:#A65E14;
  --c-gameplay:#1B7F46; --c-data:#6B2FBF; --c-platform:#0F6E80;
}
:root[data-theme="dark"]{
  --ground:#0D0D1A; --surface:#141726; --surface-2:#1D2134; --sunk:#0A0A14;
  --ink:#E9EDF7; --ink-2:#A7AFC5; --ink-3:#767E96;
  --line:#262B41; --line-2:#333A55;
  --accent:#A0D2FF; --accent-2:#C4E2FF; --accent-soft:#182842;
  --edge:#4B5578; --canvas:#0A0A14; --out:#A0D2FF; --in:#FF7BC4;
  --c-core:#6680FF; --c-render:#FF6E6E; --c-ui:#FFA64D;
  --c-gameplay:#4DE68A; --c-data:#B37DFF; --c-platform:#4DE0F0;
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--ground); color:var(--ink); overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard",
    "Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  font-size:14px; line-height:1.6; letter-spacing:-.003em;
}
.mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,"Cascadia Mono",monospace}
code{font-family:ui-monospace,Menlo,monospace; font-size:.87em; background:var(--sunk);
  border:1px solid var(--line); padding:.06em .34em; border-radius:3px; color:var(--ink-2)}
a{color:var(--accent); text-underline-offset:.2em}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:2px}
.eyebrow{font-family:ui-monospace,Menlo,monospace; font-size:10px; letter-spacing:.16em;
  text-transform:uppercase; color:var(--ink-3); font-weight:600}

/* ── shell ─────────────────────────────────────────────────────────────── */
.shell{display:flex; flex-direction:column; height:100%}
.top{border-bottom:1px solid var(--line); background:var(--ground); flex:none}
.top-in{padding:9px 20px; display:flex; align-items:center; gap:16px; flex-wrap:wrap}
.brand{font-family:ui-monospace,Menlo,monospace; font-size:13.5px; font-weight:600;
  letter-spacing:-.02em; display:flex; align-items:baseline; gap:8px}
.brand .v{font-size:11px; color:var(--ink-3); font-weight:400}
.tabs{display:flex; gap:2px; margin-left:auto; align-items:center; flex-wrap:wrap}
.tab{font-family:ui-monospace,Menlo,monospace; font-size:12px; padding:5px 11px;
  border-radius:5px; border:1px solid transparent; background:none; color:var(--ink-3);
  cursor:pointer; text-decoration:none; line-height:1.5}
.tab:hover{color:var(--ink); background:var(--surface-2)}
.tab[aria-current="page"]{color:var(--ink); background:var(--surface); border-color:var(--line)}
.tab.ext::before{content:"↖ "; opacity:.5}
.themebtn{font-family:ui-monospace,Menlo,monospace; font-size:11px; padding:5px 9px;
  border-radius:5px; border:1px solid var(--line); background:var(--surface);
  color:var(--ink-3); cursor:pointer}
.themebtn:hover{color:var(--ink)}

.body{flex:1; display:flex; min-height:0}
.stage{flex:1; position:relative; min-width:0; background:var(--canvas)}
canvas{display:block; width:100%; height:100%; cursor:grab}
canvas.grabbing{cursor:grabbing}

/* ── controls over canvas ──────────────────────────────────────────────── */
.hud{position:absolute; inset:12px 12px auto 12px; display:flex; gap:8px; flex-wrap:wrap;
  align-items:center; pointer-events:none}
.hud > *{pointer-events:auto}
.pill{display:inline-flex; align-items:center; gap:6px; font-family:ui-monospace,Menlo,monospace;
  font-size:11px; padding:4px 9px; border-radius:20px; border:1px solid var(--line);
  background:color-mix(in srgb, var(--surface) 90%, transparent); backdrop-filter:blur(8px);
  color:var(--ink-2); cursor:pointer; line-height:1.6; white-space:nowrap}
.pill:hover{color:var(--ink); border-color:var(--line-2)}
.pill[aria-pressed="true"]{background:var(--accent-soft); color:var(--ink);
  border-color:color-mix(in srgb, var(--accent) 32%, transparent)}
.pill .dot{width:8px; height:8px; border-radius:50%; flex:none}
.seg{display:inline-flex; border:1px solid var(--line); border-radius:20px; overflow:hidden;
  background:color-mix(in srgb, var(--surface) 90%, transparent); backdrop-filter:blur(8px)}
.seg button{font-family:ui-monospace,Menlo,monospace; font-size:11px; padding:4px 11px;
  background:none; border:0; color:var(--ink-3); cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent-soft); color:var(--ink)}
.hudsearch{font-family:ui-monospace,Menlo,monospace; font-size:11.5px; padding:5px 11px;
  border-radius:20px; border:1px solid var(--line); width:170px;
  background:color-mix(in srgb, var(--surface) 90%, transparent); backdrop-filter:blur(8px);
  color:var(--ink)}
.hudsearch::placeholder{color:var(--ink-3)}
.legend{position:absolute; left:12px; bottom:12px; display:flex; gap:14px; flex-wrap:wrap;
  font-family:ui-monospace,Menlo,monospace; font-size:10.5px; color:var(--ink-3);
  background:color-mix(in srgb, var(--surface) 88%, transparent); backdrop-filter:blur(8px);
  border:1px solid var(--line); border-radius:8px; padding:7px 11px; max-width:calc(100% - 24px)}
.legend span{display:inline-flex; align-items:center; gap:5px}
.legend i{width:14px; height:2px; border-radius:2px; display:inline-block}
.hint{position:absolute; right:12px; bottom:12px; font-family:ui-monospace,Menlo,monospace;
  font-size:10.5px; color:var(--ink-3); text-align:right; line-height:1.8; pointer-events:none}

/* ── sidebar ───────────────────────────────────────────────────────────── */
.side{width:344px; flex:none; border-left:1px solid var(--line); background:var(--surface);
  overflow-y:auto; padding:18px 20px 40px; display:flex; flex-direction:column; gap:22px}
.side h2{margin:0; font-family:ui-monospace,Menlo,monospace; font-size:19px; font-weight:600;
  letter-spacing:-.03em; word-break:break-all}
.side .sub{color:var(--ink-2); font-size:13px}
.blk{display:flex; flex-direction:column; gap:8px}
.kv{display:grid; grid-template-columns:1fr auto; gap:8px; font-size:12.5px;
  padding:5px 0; border-bottom:1px solid var(--line)}
.kv:last-child{border-bottom:0}
.kv .k{color:var(--ink-3); font-family:ui-monospace,Menlo,monospace; font-size:10.5px;
  letter-spacing:.1em; text-transform:uppercase; font-weight:600; align-self:center}
.kv .v{font-family:ui-monospace,Menlo,monospace; font-variant-numeric:tabular-nums;
  font-weight:600; text-align:right}
.pillrow{display:flex; gap:5px; flex-wrap:wrap}
.mchip{font-family:ui-monospace,Menlo,monospace; font-size:11px; padding:2px 8px;
  border-radius:4px; border:1px solid var(--line); background:var(--ground);
  color:var(--ink-2); cursor:pointer}
.mchip:hover{color:var(--ink); border-color:var(--line-2)}
.mchip.out{border-color:color-mix(in srgb, var(--out) 42%, transparent); color:var(--out)}
.mchip.in{border-color:color-mix(in srgb, var(--in) 42%, transparent); color:var(--in)}
.tag{font-family:ui-monospace,Menlo,monospace; font-size:10px; padding:1px 6px; border-radius:3px;
  border:1px solid var(--line); color:var(--ink-3)}
.tag.native{color:var(--c-ui); border-color:color-mix(in srgb,var(--c-ui) 35%,transparent)}
.tag.wasm{color:var(--c-data); border-color:color-mix(in srgb,var(--c-data) 35%,transparent)}
.rank{display:flex; flex-direction:column; gap:5px}
.rankrow{display:grid; grid-template-columns:96px 1fr 28px; gap:8px; align-items:center;
  font-size:12px; cursor:pointer}
.rankrow:hover .rname{color:var(--ink)}
.rname{font-family:ui-monospace,Menlo,monospace; color:var(--ink-2); overflow:hidden;
  text-overflow:ellipsis; white-space:nowrap}
.rtrack{height:7px; background:var(--sunk); border-radius:4px; border:1px solid var(--line);
  overflow:hidden}
.rfill{height:100%}
.rval{font-family:ui-monospace,Menlo,monospace; font-size:11px; color:var(--ink-3);
  font-variant-numeric:tabular-nums; text-align:right}
.empty{color:var(--ink-3); font-size:13px; line-height:1.75}
.empty b{color:var(--ink)}
.cyc{font-family:ui-monospace,Menlo,monospace; font-size:11.5px; color:var(--ink-2);
  background:var(--ground); border:1px solid var(--line); border-radius:6px; padding:7px 9px;
  cursor:pointer; line-height:1.7; word-break:break-word}
.cyc:hover{border-color:var(--line-2); color:var(--ink)}

@media (max-width:900px){
  body{overflow:auto}
  .body{flex-direction:column}
  .stage{height:62vh; min-height:380px}
  .side{width:auto; border-left:0; border-top:1px solid var(--line)}
  .hudsearch{width:130px}
  .hint{display:none}          /* pointer affordances collide with the legend down here */
}
@media (prefers-reduced-motion:reduce){*{transition:none !important}}
</style>

/* ── theme ───────────────────────────────────────────────────────────── */
document.getElementById('themebtn').addEventListener('click', () => {
  const cur = document.documentElement.getAttribute('data-theme');
  const dark = cur ? cur === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.setAttribute('data-theme', dark ? 'light' : 'dark');
  readTheme(); draw();
});

let CSSV = {};
function readTheme(){
  const cs = getComputedStyle(document.documentElement);
  const g = n => cs.getPropertyValue(n).trim();
  CSSV = {
    ink:g('--ink'), ink2:g('--ink-2'), ink3:g('--ink-3'),
    edge:g('--edge'), canvas:g('--canvas'), surface:g('--surface'),
    line:g('--line'), out:g('--out'), inc:g('--in'), accent:g('--accent'),
    cat:Object.fromEntries(Object.keys(DATA.cats).map(k => [k, g('--c-' + k)])),
  };
}
readTheme();
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
  if (!document.documentElement.getAttribute('data-theme')) { readTheme(); draw(); }
});

/* ── model ───────────────────────────────────────────────────────────── */
const CATKEYS = Object.keys(DATA.cats);
const N = DATA.mods.map((m,i) => ({...m, i, x:0, y:0, vx:0, vy:0, r:0}));
const IDX = Object.fromEntries(N.map(n => [n.id, n]));
const E = DATA.edges.map(e => ({s:IDX[e.from], t:IDX[e.to], w:e.w}))
  .filter(e => e.s && e.t);
const maxLoc = Math.max(...N.map(n => n.loc));
N.forEach(n => {
  n.r = 5 + 22 * Math.sqrt(n.loc / maxLoc);
  n.lw = n.id.length * 6.4;          /* label footprint at the base 11px mono size */
});

const CYCSET = new Set();
DATA.cycles.forEach(c => c.forEach(id => CYCSET.add(id)));
const CYCEDGE = new Set();
DATA.cycles.forEach(c => { const s = new Set(c);
  E.forEach(e => { if (s.has(e.s.id) && s.has(e.t.id)) CYCEDGE.add(e.s.id + '>' + e.t.id); }); });

/* seed positions on a category ring so the sim converges fast and reproducibly */
const RING = {};
CATKEYS.forEach((k,i) => {
  const a = (i / CATKEYS.length) * Math.PI * 2 - Math.PI / 2;
  RING[k] = {x:Math.cos(a) * 430, y:Math.sin(a) * 430};
});
N.forEach((n,i) => {
  const a = RING[n.cat], t = i * 2.399963;
  n.x = a.x + Math.cos(t) * 90; n.y = a.y + Math.sin(t) * 90;
});

/* ── state ───────────────────────────────────────────────────────────── */
let mode = 'force', selected = null, hovered = null,
    focusOnly = false, showCyc = false, query = '',
    hiddenCats = new Set(), alpha = 1, dragging = null,
    view = {x:0, y:0, k:1}, panning = null, moved = false, touched = false;

const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;

function resize(){
  const r = cv.getBoundingClientRect();
  DPR = Math.min(devicePixelRatio || 1, 2);
  W = r.width; H = r.height;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (!touched) fit();
  draw();
}
addEventListener('resize', resize);

function visible(n){
  if (hiddenCats.has(n.cat)) return false;
  if (focusOnly && selected){
    if (n === selected) return true;
    return selected.deps.includes(n.id) || selected.rdeps.includes(n.id);
  }
  return true;
}
const matches = n => query && (n.id.includes(query) || n.desc.toLowerCase().includes(query));

/* ── layouts ─────────────────────────────────────────────────────────── */
function ringLayout(){
  const groups = CATKEYS.map(k => N.filter(n => n.cat === k)
    .sort((a,b) => b.rdeps.length - a.rdeps.length || b.loc - a.loc));
  const total = N.length, gap = 0.17;
  /* radius chosen so the arc between neighbours always clears a label */
  const R = (total * 46) / (Math.PI * 2) + 60;
  let cursor = -Math.PI / 2;
  groups.forEach(g => {
    const span = (g.length / total) * (Math.PI * 2 - gap * CATKEYS.length);
    g.forEach((n,i) => {
      const a = cursor + (span * (i + 0.5) / g.length);
      n.tx = Math.cos(a) * R; n.ty = Math.sin(a) * R; n.angle = a;
    });
    cursor += span + gap;
  });
}

function tick(){
  if (mode === 'ring'){
    let move = 0;
    N.forEach(n => {
      const dx = (n.tx - n.x) * 0.16, dy = (n.ty - n.y) * 0.16;
      n.x += dx; n.y += dy; move += Math.abs(dx) + Math.abs(dy);
    });
    return move > 0.4;
  }
  for (let a = 0; a < N.length; a++){
    const p = N[a];
    for (let b = a + 1; b < N.length; b++){
      const q = N[b];
      let dx = q.x - p.x, dy = q.y - p.y;
      let d2 = dx*dx + dy*dy;
      if (d2 < 1) { d2 = 1; dx = (a - b) * 0.5; dy = 0.5; }
      const d = Math.sqrt(d2);
      const rep = Math.min(26000, 7000 + (p.r + q.r) * 260) / d2;
      const fx = dx / d * rep, fy = dy / d * rep;
      p.vx -= fx; p.vy -= fy; q.vx += fx; q.vy += fy;
    }
  }
  E.forEach(e => {
    const p = e.s, q = e.t;
    const dx = q.x - p.x, dy = q.y - p.y;
    const d = Math.hypot(dx, dy) || 1;
    const L = 150 + p.r + q.r;
    const f = (d - L) * 0.011 * Math.min(1.8, 0.7 + Math.log2(1 + e.w) * 0.26);
    const fx = dx / d * f, fy = dy / d * f;
    p.vx += fx; p.vy += fy; q.vx -= fx; q.vy -= fy;
  });
  N.forEach(n => {
    const a = RING[n.cat];
    n.vx += (a.x - n.x) * 0.0115 + (0 - n.x) * 0.0010;
    n.vy += (a.y - n.y) * 0.0115 + (0 - n.y) * 0.0010;
  });
  let energy = 0;
  N.forEach(n => {
    if (n === dragging) { n.vx = n.vy = 0; return; }
    n.vx *= 0.85; n.vy *= 0.85;
    const sp = Math.hypot(n.vx, n.vy);
    if (sp > 16) { n.vx = n.vx / sp * 16; n.vy = n.vy / sp * 16; }
    n.x += n.vx * alpha; n.y += n.vy * alpha;
    energy += sp;
  });
  separate();
  alpha *= 0.994;
  return energy > 1.2 && alpha > 0.02;
}

/* Hard separation so discs never overlap and labels stay readable. Labels are
   centred under the disc, so a node's footprint is wider than it is tall. */
function separate(){
  for (let pass = 0; pass < 3; pass++){
    for (let a = 0; a < N.length; a++){
      const p = N[a];
      for (let b = a + 1; b < N.length; b++){
        const q = N[b];
        let dx = q.x - p.x, dy = q.y - p.y;
        const minD = p.r + q.r + 16;
        let d = Math.hypot(dx, dy);
        if (d < 0.01){ dx = 0.7; dy = 0.7; d = 1; }
        if (d < minD){
          const push = (minD - d) / d * 0.5;
          const ox = dx * push, oy = dy * push;
          if (p !== dragging){ p.x -= ox; p.y -= oy; }
          if (q !== dragging){ q.x += ox; q.y += oy; }
          continue;
        }
        /* label band: same row + horizontally overlapping text -> shove apart in x */
        const halfW = (p.lw + q.lw) / 2 + 8;
        if (Math.abs(dy) < 15 && Math.abs(dx) < halfW){
          const push = (halfW - Math.abs(dx)) * 0.25 * (dx < 0 ? -1 : 1);
          if (p !== dragging) p.x -= push;
          if (q !== dragging) q.x += push;
        }
      }
    }
  }
}

/* Frame the whole graph — labels included — inside the area the HUD does not cover. */
function fit(){
  const vis = N.filter(visible);
  if (!vis.length) return;
  const IT = 76, IB = 66, IL = 44, IR = 44;   /* top HUD / bottom legend insets */
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  vis.forEach(n => {
    let ax0 = n.x - n.lw/2, ax1 = n.x + n.lw/2,
        ay0 = n.y - n.r,    ay1 = n.y + n.r + 18;
    if (mode === 'ring' && n.angle != null){
      /* the label runs radially outward, both when flipped and when not */
      const tip = n.r + 8 + n.lw;
      const tx = n.x + Math.cos(n.angle) * tip, ty = n.y + Math.sin(n.angle) * tip;
      ax0 = Math.min(n.x - n.r, tx - 6); ax1 = Math.max(n.x + n.r, tx + 6);
      ay0 = Math.min(n.y - n.r, ty - 9); ay1 = Math.max(n.y + n.r, ty + 9);
    }
    x0 = Math.min(x0, ax0); x1 = Math.max(x1, ax1);
    y0 = Math.min(y0, ay0); y1 = Math.max(y1, ay1);
  });
  const w = Math.max(1, x1 - x0), h = Math.max(1, y1 - y0);
  const availW = Math.max(80, W - IL - IR), availH = Math.max(80, H - IT - IB);
  view.k = Math.max(0.3, Math.min(2, Math.min(availW / w, availH / h)));
  view.x = IL + availW/2 - W/2 - ((x0 + x1)/2) * view.k;
  view.y = IT + availH/2 - H/2 - ((y0 + y1)/2) * view.k;
}

let raf = null;
function loop(){
  const busy = tick();
  draw();
  raf = busy || dragging ? requestAnimationFrame(loop) : null;
}
function kick(a = 1){ alpha = a; if (!raf) raf = requestAnimationFrame(loop); }

/* ── draw ────────────────────────────────────────────────────────────── */
function toScreen(n){ return {x: n.x * view.k + view.x + W/2, y: n.y * view.k + view.y + H/2}; }
function toWorld(px, py){ return {x: (px - W/2 - view.x)/view.k, y: (py - H/2 - view.y)/view.k}; }

function draw(){
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = CSSV.canvas; ctx.fillRect(0, 0, W, H);

  const hi = hovered || selected;
  const rel = hi ? new Set([hi.id, ...hi.deps, ...hi.rdeps]) : null;

  /* edges */
  E.forEach(e => {
    if (!visible(e.s) || !visible(e.t)) return;
    const a = toScreen(e.s), b = toScreen(e.t);
    const isOut = hi && e.s === hi, isIn = hi && e.t === hi;
    const inCyc = showCyc && CYCEDGE.has(e.s.id + '>' + e.t.id);
    let color = CSSV.edge, width = 0.7, alphaV = hi ? 0.14 : 0.5;
    if (isOut){ color = CSSV.out; width = 1.7; alphaV = 0.95; }
    else if (isIn){ color = CSSV.inc; width = 1.7; alphaV = 0.95; }
    else if (inCyc && !hi){ color = CSSV.inc; width = 1.4; alphaV = 0.85; }
    else if (inCyc && hi){ alphaV = 0.2; }

    const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy) || 1;
    let mx, my;
    if (mode === 'ring'){
      /* chord: bend toward the ring centre so long links read as arcs, not clutter */
      const cx = view.x + W/2, cy = view.y + H/2;
      mx = cx + ((a.x + b.x)/2 - cx) * 0.32;
      my = cy + ((a.y + b.y)/2 - cy) * 0.32;
    } else {
      const nx = -dy / d, ny = dx / d, bow = Math.min(26, d * 0.13);
      mx = (a.x + b.x)/2 + nx * bow; my = (a.y + b.y)/2 + ny * bow;
    }
    const tr = e.t.r * view.k + 3.5;
    ctx.globalAlpha = alphaV; ctx.strokeStyle = color; ctx.lineWidth = width;
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.quadraticCurveTo(mx, my, b.x, b.y); ctx.stroke();

    if (alphaV > 0.4){
      /* arrowhead at the target rim, aimed along the curve's final tangent */
      const tx = b.x - mx, ty = b.y - my, tl = Math.hypot(tx, ty) || 1;
      const ux = tx / tl, uy = ty / tl;
      const px = b.x - ux * tr, py = b.y - uy * tr;
      const s = isOut || isIn ? 6.5 : 4.6;
      ctx.beginPath();
      ctx.moveTo(px, py);
      ctx.lineTo(px - ux*s + -uy*s*0.55, py - uy*s + ux*s*0.55);
      ctx.lineTo(px - ux*s - -uy*s*0.55, py - uy*s - ux*s*0.55);
      ctx.closePath(); ctx.fillStyle = color; ctx.fill();
    }
  });
  ctx.globalAlpha = 1;

  /* nodes */
  const fs = Math.max(9, Math.min(13, 11 * view.k));
  N.forEach(n => {
    if (!visible(n)) return;
    const p = toScreen(n), r = Math.max(3, n.r * view.k);
    const dim = (hi && !rel.has(n.id)) || (query && !matches(n));
    const cyc = showCyc && CYCSET.has(n.id);

    ctx.globalAlpha = dim ? 0.2 : 1;
    ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, Math.PI*2);
    ctx.fillStyle = CSSV.cat[n.cat]; ctx.fill();

    if (n === selected){
      ctx.lineWidth = 2.5; ctx.strokeStyle = CSSV.ink;
      ctx.beginPath(); ctx.arc(p.x, p.y, r + 4.5, 0, Math.PI*2); ctx.stroke();
    } else if (cyc && !dim){
      ctx.lineWidth = 1.6; ctx.strokeStyle = CSSV.inc;
      ctx.beginPath(); ctx.arc(p.x, p.y, r + 3, 0, Math.PI*2); ctx.stroke();
    } else if (query && matches(n)){
      ctx.lineWidth = 2; ctx.strokeStyle = CSSV.accent;
      ctx.beginPath(); ctx.arc(p.x, p.y, r + 4, 0, Math.PI*2); ctx.stroke();
    }

    ctx.font = (n === hi ? '600 ' : '') + fs + 'px ui-monospace, Menlo, monospace';
    ctx.globalAlpha = dim ? 0.16 : 1;
    ctx.lineWidth = 3; ctx.strokeStyle = CSSV.canvas;
    ctx.fillStyle = n === hi ? CSSV.ink : CSSV.ink2;

    if (mode === 'ring' && n.angle != null){
      /* labels radiate outward, so neighbours on the ring can never collide */
      const flip = Math.cos(n.angle) < 0;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(n.angle + (flip ? Math.PI : 0));
      ctx.textAlign = flip ? 'right' : 'left';
      ctx.textBaseline = 'middle';
      const off = (r + 6) * (flip ? -1 : 1);
      ctx.strokeText(n.id, off, 0);
      ctx.fillText(n.id, off, 0);
      ctx.restore();
    } else {
      ctx.textAlign = 'center'; ctx.textBaseline = 'top';
      ctx.strokeText(n.id, p.x, p.y + r + 3);
      ctx.fillText(n.id, p.x, p.y + r + 3);
    }
  });
  ctx.globalAlpha = 1;
}

/* ── interaction ─────────────────────────────────────────────────────── */
function nodeAt(px, py){
  let best = null, bd = Infinity;
  for (const n of N){
    if (!visible(n)) continue;
    const p = toScreen(n), r = Math.max(8, n.r * view.k + 4);
    const d = Math.hypot(p.x - px, p.y - py);
    if (d < r && d < bd){ bd = d; best = n; }
  }
  return best;
}
function localPos(ev){
  const r = cv.getBoundingClientRect();
  return {x: ev.clientX - r.left, y: ev.clientY - r.top};
}
cv.addEventListener('pointerdown', ev => {
  cv.setPointerCapture(ev.pointerId);
  const p = localPos(ev), n = nodeAt(p.x, p.y);
  moved = false;
  if (n){ dragging = n; kick(Math.max(alpha, 0.35)); }
  else panning = {x: ev.clientX - view.x, y: ev.clientY - view.y, cv:cv.classList.add('grabbing')};
});
cv.addEventListener('pointermove', ev => {
  const p = localPos(ev);
  if (dragging){
    const w = toWorld(p.x, p.y);
    dragging.x = w.x; dragging.y = w.y; dragging.vx = dragging.vy = 0;
    moved = true; kick(Math.max(alpha, 0.3)); return;
  }
  if (panning){
    view.x = ev.clientX - panning.x; view.y = ev.clientY - panning.y;
    moved = true; touched = true; draw(); return;
  }
  const n = nodeAt(p.x, p.y);
  if (n !== hovered){ hovered = n; cv.style.cursor = n ? 'pointer' : 'grab'; draw(); }
});
function endPointer(ev){
  if (!moved){
    const p = localPos(ev), n = nodeAt(p.x, p.y);
    select(n);
  }
  dragging = null; panning = null; cv.classList.remove('grabbing');
}
cv.addEventListener('pointerup', endPointer);
cv.addEventListener('pointercancel', () => { dragging = null; panning = null;
  cv.classList.remove('grabbing'); });
cv.addEventListener('wheel', ev => {
  ev.preventDefault();
  const p = localPos(ev);
  const before = toWorld(p.x, p.y);
  touched = true;
  view.k = Math.max(0.35, Math.min(3.2, view.k * (ev.deltaY < 0 ? 1.12 : 1/1.12)));
  const after = toWorld(p.x, p.y);
  view.x += (after.x - before.x) * view.k;
  view.y += (after.y - before.y) * view.k;
  draw();
}, {passive:false});

/* ── sidebar ─────────────────────────────────────────────────────────── */
const side = document.getElementById('side');
const fmt = n => n.toLocaleString('en-US');
const el = (t,c,x) => { const e = document.createElement(t);
  if (c) e.className = c; if (x != null) e.textContent = x; return e; };

function select(n){
  selected = n;
  if (focusOnly) kick(0.9);
  renderSide(); draw();
}

function chipRow(ids, cls){
  const w = el('div','pillrow');
  if (!ids.length){ w.append(el('span','empty','—')); return w; }
  ids.slice().sort().forEach(id => {
    const b = el('button','mchip ' + cls, id); b.type = 'button';
    b.addEventListener('click', () => select(IDX[id]));
    w.append(b);
  });
  return w;
}

function renderSide(){
  side.textContent = '';
  if (!selected){ renderOverviewSide(); return; }
  const m = selected;

  const head = el('div','blk');
  const h = el('h2', null, m.id);
  head.append(h);
  const tags = el('div','pillrow');
  const cd = el('span','tag', DATA.cats[m.cat].label);
  cd.style.color = 'var(--c-' + m.cat + ')';
  cd.style.borderColor = 'color-mix(in srgb, var(--c-' + m.cat + ') 40%, transparent)';
  tags.append(cd);
  if (m.gate === 'native') tags.append(el('span','tag native','네이티브 전용'));
  if (m.gate === 'wasm') tags.append(el('span','tag wasm','wasm 전용'));
  if (m.vis === 'private') tags.append(el('span','tag','pub(crate)'));
  if (CYCSET.has(m.id)) tags.append(el('span','tag','순환 참여'));
  head.append(tags);
  if (m.desc) head.append(el('div','sub', m.desc));
  side.append(head);

  const stats = el('div','blk');
  [['줄', fmt(m.loc)], ['파일', m.files], ['#[test]', m.tests],
   ['의존 →', m.deps.length], ['← 피의존', m.rdeps.length]].forEach(([k,v]) => {
    const r = el('div','kv'); r.append(el('span','k',k), el('span','v',String(v))); stats.append(r);
  });
  side.append(stats);

  const b1 = el('div','blk');
  b1.append(el('div','eyebrow','이 모듈이 쓰는 것 → ' + m.deps.length), chipRow(m.deps, 'out'));
  side.append(b1);

  const b2 = el('div','blk');
  b2.append(el('div','eyebrow','이 모듈을 쓰는 것 ← ' + m.rdeps.length), chipRow(m.rdeps, 'in'));
  side.append(b2);

  if (m.ext.length){
    const b3 = el('div','blk');
    const w = el('div','pillrow');
    m.ext.forEach(([name,count]) => w.append(el('span','mchip', name + ' ·' + count)));
    b3.append(el('div','eyebrow','외부 크레이트'), w);
    side.append(b3);
  }
}

function rankBlock(title, key, note){
  const b = el('div','blk');
  b.append(el('div','eyebrow', title));
  if (note) b.append(el('div','empty', note));
  const list = el('div','rank');
  const rows = [...DATA.mods].sort((a,b2) => b2[key].length - a[key].length).slice(0, 8);
  const max = rows[0][key].length || 1;
  rows.forEach(m => {
    const r = el('div','rankrow'); r.tabIndex = 0;
    r.append(el('div','rname', m.id));
    const tr = el('div','rtrack'), f = el('div','rfill');
    f.style.width = (m[key].length / max * 100) + '%';
    f.style.background = 'var(--c-' + m.cat + ')';
    tr.append(f);
    r.append(tr, el('div','rval', String(m[key].length)));
    const go = () => select(IDX[m.id]);
    r.addEventListener('click', go);
    r.addEventListener('keydown', e => { if (e.key === 'Enter'){ e.preventDefault(); go(); } });
    list.append(r);
  });
  b.append(list);
  return b;
}

function renderOverviewSide(){
  const head = el('div','blk');
  head.append(el('div','eyebrow','모듈 의존 그래프'));
  const h = el('h2', null, DATA.stats.modules + ' 모듈 · ' + DATA.stats.edges + ' 간선');
  h.style.fontSize = '17px'; h.style.wordBreak = 'keep-all';
  head.append(h);
  const p = el('div','empty');
  p.innerHTML = '주석을 제거한 <b>src/</b> 소스에서 <b>crate::&lt;모듈&gt;</b> 참조를 세어 만든 ' +
    '실제 의존 관계다. 문서 주석의 상호 참조는 제외했다 — 포함하면 간선이 229개에서 261개로 ' +
    '부풀고 전체가 하나의 거대한 순환처럼 보인다.<br><br>노드를 누르면 그 모듈이 무엇을 쓰고 ' +
    '누가 그것을 쓰는지 나온다.';
  head.append(p);
  side.append(head);

  side.append(rankBlock('가장 많이 쓰이는 모듈 ←', 'rdeps',
    '피의존 수. 여기를 고치면 파급이 가장 넓다.'));
  side.append(rankBlock('가장 많이 쓰는 모듈 →', 'deps',
    '의존 수. 이 모듈들이 나머지를 엮는다.'));

  const cyc = el('div','blk');
  cyc.append(el('div','eyebrow','순환 묶음 3개'));
  cyc.append(el('div','empty',
    '상호 의존이 남아 있는 곳. 사고가 아니라 대체로 의도된 확장 지점이다 — ' +
    'app 묶음은 각 모듈이 impl crate::app::App 로 App에 편의 메서드를 붙이면서 생긴다.'));
  DATA.cycles.forEach(c => {
    const b = el('button','cyc', c.join('  ↔  ')); b.type = 'button';
    b.addEventListener('click', () => {
      showCyc = true;
      document.getElementById('cycbtn').setAttribute('aria-pressed','true');
      select(IDX[c[0]]);
    });
    cyc.append(b);
  });
  side.append(cyc);

  const leaves = DATA.mods.filter(m => m.deps.length === 0);
  const lb = el('div','blk');
  lb.append(el('div','eyebrow','잎 모듈 ' + leaves.length + '개'));
  lb.append(el('div','empty','다른 엔진 모듈을 전혀 쓰지 않는다. 그대로 떼어내 쓸 수 있는 조각들.'));
  lb.append(chipRow(leaves.map(m => m.id), ''));
  side.append(lb);
}

/* ── HUD wiring ──────────────────────────────────────────────────────── */
const legend = document.getElementById('legend');
Object.entries(DATA.cats).forEach(([k,v]) => {
  const b = el('button','pill'); b.type = 'button'; b.setAttribute('aria-pressed','true');
  b.style.cssText = 'background:none;border:0;padding:0 0;backdrop-filter:none';
  const d = el('span','dot'); d.style.background = 'var(--c-' + k + ')';
  b.append(d, el('span',null,v.label));
  b.addEventListener('click', () => {
    hiddenCats.has(k) ? hiddenCats.delete(k) : hiddenCats.add(k);
    b.setAttribute('aria-pressed', !hiddenCats.has(k));
    b.style.opacity = hiddenCats.has(k) ? 0.35 : 1;
    kick(0.6);
  });
  legend.append(b);
});
const dirLegend = el('span');
dirLegend.innerHTML =
  '<i style="background:var(--out)"></i>&nbsp;선택 → 의존 &nbsp;&nbsp;' +
  '<i style="background:var(--in)"></i>&nbsp;피의존 → 선택';
dirLegend.style.cssText = 'display:inline-flex;align-items:center;gap:4px;' +
  'padding-left:12px;border-left:1px solid var(--line)';
legend.append(dirLegend);

function setMode(m){
  mode = m;
  document.getElementById('mode-force').setAttribute('aria-pressed', m === 'force');
  document.getElementById('mode-ring').setAttribute('aria-pressed', m === 'ring');
  if (m === 'ring'){ ringLayout(); settle(90); }
  else settle(320);
  fit(); kick(0.35);
}
/* run the sim without painting, so the first frame the user sees is already laid out */
function settle(n){ alpha = 1; for (let i = 0; i < n; i++) tick(); }
document.getElementById('mode-force').addEventListener('click', () => {
  history.replaceState(null, '', '#force'); setMode('force');
});
document.getElementById('mode-ring').addEventListener('click', () => {
  history.replaceState(null, '', '#ring'); setMode('ring');
});

document.getElementById('focus').addEventListener('click', e => {
  focusOnly = !focusOnly;
  e.currentTarget.setAttribute('aria-pressed', focusOnly);
  kick(0.9);
});
document.getElementById('cycbtn').addEventListener('click', e => {
  showCyc = !showCyc;
  e.currentTarget.setAttribute('aria-pressed', showCyc);
  draw();
});
document.getElementById('reset').addEventListener('click', () => {
  touched = false;
  selected = null; hovered = null; focusOnly = false; showCyc = false;
  hiddenCats.clear(); query = '';
  document.getElementById('q').value = '';
  document.getElementById('focus').setAttribute('aria-pressed','false');
  document.getElementById('cycbtn').setAttribute('aria-pressed','false');
  legend.querySelectorAll('.pill').forEach(b => {
    b.setAttribute('aria-pressed','true'); b.style.opacity = 1; });
  N.forEach((n,i) => { const a = RING[n.cat], t = i * 2.399963;
    n.x = a.x + Math.cos(t)*90; n.y = a.y + Math.sin(t)*90; n.vx = n.vy = 0; });
  if (mode === 'ring'){ ringLayout(); settle(90); } else settle(420);
  fit();
  renderSide(); kick(0.3);
});
document.getElementById('q').addEventListener('input', e => {
  query = e.target.value.trim().toLowerCase();
  const hits = N.filter(matches);
  if (query && hits.length === 1) select(hits[0]); else draw();
});

document.getElementById('stat').textContent =
  DATA.stats.modules + ' 모듈 · ' + DATA.stats.edges + ' 간선';

/* ── boot ────────────────────────────────────────────────────────────── */
/* #ring / #force in the URL picks the layout, so a given view is linkable */
resize();
renderSide();
settle(420);                       /* force pass first — ring targets do not exist yet */
if (location.hash.slice(1) === 'ring'){
  mode = 'ring';
  document.getElementById('mode-force').setAttribute('aria-pressed', 'false');
  document.getElementById('mode-ring').setAttribute('aria-pressed', 'true');
  ringLayout();
  settle(120);
}
fit();
kick(0.3);
</script>
</body>
