<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Centered Text (EW-001) — skeleton-engine (wasm)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0d0d0d;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      gap: 12px;
      font-family: system-ui, sans-serif;
      color: #888;
    }
    #game-canvas { display: block; border: 1px solid #333; background: #0d1220; }
    #start {
      padding: 8px 20px;
      font: inherit;
      color: #b0d0ff;
      background: #1a2740;
      border: 1px solid #3a557f;
      border-radius: 5px;
      cursor: pointer;
    }
    #start:hover { background: #223556; }
    #start:disabled { opacity: 0.5; cursor: default; }
    #status { font-size: 13px; }
    #status code { color: #b0d0ff; }
  </style>
</head>
<body>
  <canvas id="game-canvas" width="960" height="540" tabindex="0"></canvas>
  <button id="start" disabled>Loading WASM…</button>
  <p id="status">
    Each cyan/green <code>DrawText::centered</code> label's center should sit on its white guide line —
    for any x. This is the browser view of the EW-001 fix.
  </p>
  <script type="module">
    import init, { run_centered_text } from "./pkg/centered_text.js";
    const startBtn = document.getElementById("start");
    const status = document.getElementById("status");
    try {
      await init();
      const start = () => {
        startBtn.disabled = true;
        startBtn.textContent = "Running";
        run_centered_text();
        // winit needs keyboard focus on the canvas to receive Esc.
        document.getElementById("game-canvas").focus();
      };
      startBtn.textContent = "Start";
      startBtn.disabled = false;
      startBtn.addEventListener("click", start);
      // Headless render smoke (scripts/centered_text_smoke.sh) loads `?autostart=1`
      // to render without a click; humans click Start.
      if (new URLSearchParams(location.search).has("autostart")) start();
    } catch (e) {
      status.textContent = "Error: " + e;
      console.error(e);
    }
  </script>
</body>
</html>
