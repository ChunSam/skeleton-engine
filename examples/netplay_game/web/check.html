<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- The verdict is written HERE, by `web_check_netplay`. `scripts/netplay_web_smoke.sh` reads it
       live over Chrome's DevTools /json endpoint, so this starting value must not already contain
       the token NETPLAY_CHECK. -->
  <title>Netplay WebSocket — running…</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0d0d0d;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 100vh; font-family: system-ui, sans-serif; color: #888;
    }
    #game-canvas { display: block; border: 1px solid #333; background: #0a0d14; }
    #status { margin-top: 10px; font-size: 13px; max-width: 66ch; text-align: center; }
    #status code { color: #b0d0ff; }
  </style>
</head>
<body>
  <canvas id="game-canvas" width="1024" height="640" tabindex="0"></canvas>
  <p id="status">Loading WASM…</p>
  <script type="module">
    import init, { web_check_netplay } from "./pkg/netplay_game.js";
    const status = document.getElementById("status");
    try {
      await init();
      status.innerHTML =
        'Asserting the WebSocket handshake completed and that entities streamed in over the ' +
        'browser socket. Needs <code>cargo run --example netplay_server</code> on ' +
        '<code>127.0.0.1:9006</code>. The verdict goes to the page title.';
      web_check_netplay();
    } catch (e) {
      // A load failure must still produce a verdict, or the script cannot tell "the page broke"
      // from "the page is still thinking" — both read as no title.
      document.title = "NETPLAY_CHECK: FAIL — wasm init threw: " + String(e).replace(/"/g, "'");
      status.textContent = "Error: " + e;
      console.error(e);
    }
  </script>
</body>
</html>
