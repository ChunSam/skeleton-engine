<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Netplay Salvage — skeleton-engine (wasm)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0d0d0d;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 100vh; font-family: system-ui, sans-serif; color: #888;
    }
    #game-canvas { display: block; border: 1px solid #333; background: #0a0d14; }
    #status { margin-top: 10px; font-size: 13px; max-width: 70ch; text-align: center; }
    #status code { color: #b0d0ff; }
  </style>
</head>
<body>
  <canvas id="game-canvas" width="1024" height="640" tabindex="0"></canvas>
  <p id="status">Loading WASM…</p>
  <script type="module">
    import init, { run_netplay_game } from "./pkg/netplay_game.js";
    const status = document.getElementById("status");
    try {
      await init();
      status.innerHTML =
        'Connecting to <code>ws://127.0.0.1:9006</code> — start it with ' +
        '<code>cargo run --example netplay_server</code>. Click the canvas, then ' +
        '<code>WASD</code> to fly and <code>-</code> / <code>=</code> to resize the area of ' +
        'interest and watch entities stream in and out. Open this page twice to contest a pickup.';
      run_netplay_game();
      // winit needs keyboard focus on the canvas to receive input.
      document.getElementById("game-canvas").focus();
    } catch (e) {
      status.textContent = "Error: " + e;
      console.error(e);
    }
  </script>
</body>
</html>
