<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Positional audio — skeleton-engine (wasm)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0d0d0d;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      gap: 12px;
      font-family: system-ui, sans-serif;
      color: #999;
    }
    #game-canvas { display: block; border: 1px solid #333; background: #0d1220; }
    #start {
      padding: 8px 20px;
      font: inherit;
      color: #b0d0ff;
      background: #1a2740;
      border: 1px solid #3a557f;
      border-radius: 5px;
      cursor: pointer;
    }
    #start:hover { background: #223556; }
    #start:disabled { opacity: 0.5; cursor: default; }
    #status { font-size: 13px; max-width: 760px; text-align: center; }
    #status code { color: #b0d0ff; }
  </style>
</head>
<body>
  <canvas id="game-canvas" width="760" height="360" tabindex="0"></canvas>
  <button id="start" disabled>Loading WASM…</button>
  <p id="status">
    The <strong>same</strong> <code>Audio</code> facade code as the native example, running on the web.
    Click <strong>Start</strong> (unlocks the browser <code>AudioContext</code>), then press:
    <code>Space</code> start/restart · <code>← → ↑ ↓</code> move the listener · <code>S</code> stop.
    A looping sound orbits a fixed point; its volume falls with distance and pans left/right with the x-offset.
  </p>
  <script type="module">
    import init, { run_positional_audio } from "./pkg/positional_audio.js";
    const startBtn = document.getElementById("start");
    const status = document.getElementById("status");
    try {
      await init();
      const start = () => {
        startBtn.disabled = true;
        startBtn.textContent = "Running — press Space, then move with the arrows";
        run_positional_audio();
        // winit needs keyboard focus on the canvas to receive key presses; the
        // click is also the user gesture that unlocks the AudioContext.
        document.getElementById("game-canvas").focus();
      };
      startBtn.textContent = "Start";
      startBtn.disabled = false;
      startBtn.addEventListener("click", start);
      // Headless render smoke loads `?autostart=1` to boot without a click (no audio
      // unlock, but it proves the facade-using example renders on the web); humans
      // click Start to actually hear it.
      if (new URLSearchParams(location.search).has("autostart")) start();
    } catch (e) {
      status.textContent = "Error: " + e;
      console.error(e);
    }
  </script>
</body>
</html>
