<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fail-path check — skeleton-engine (wasm)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0d0d0d;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: system-ui, sans-serif;
      color: #888;
      gap: 10px;
    }
    #game-canvas { display: block; border: 1px solid #333; background: #0d1220; }
    #status { font-size: 13px; text-align: center; }
    #status code { color: #b0d0ff; }
    #result { font-size: 16px; font-weight: 700; color: #cfe6ff; min-height: 1.4em; }
  </style>
</head>
<body>
  <canvas id="game-canvas" width="800" height="600" tabindex="0"></canvas>
  <p id="status">Loading WASM…</p>
  <p id="result"></p>
  <script type="module">
    import init, { run_wasm_failpaths } from "./pkg/wasm_failpaths.js";
    const status = document.getElementById("status");
    try {
      await init();
      status.innerHTML =
        'Two DELIBERATE failures: a 404 asset fetch, and a send issued before the socket opens. ' +
        'Needs <code>cargo run --example wasm_failpaths_echo_server</code> on ' +
        '<code>ws://127.0.0.1:9004</code>. The verdict lands in the page title and below.';
      run_wasm_failpaths();
    } catch (e) {
      status.textContent = "Error: " + e;
      document.title = "FAILPATH_CHECK: FAIL: wasm module did not start: " + e;
      console.error(e);
    }
  </script>
</body>
</html>
