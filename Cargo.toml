[workspace]
members = [".", "engine_reflect_derive"]
resolver = "2"

[package]
name        = "skeleton-engine"
version     = "0.49.4"
edition     = "2021"
description = "Lightweight 2D game engine — wgpu rendering, custom ECS, rapier2d physics"
repository  = "https://github.com/ChunSam/skeleton-engine"
homepage    = "https://github.com/ChunSam/skeleton-engine"
documentation = "https://docs.rs/skeleton-engine"
readme      = "README.md"
license     = "MIT"
keywords    = ["game", "engine", "wgpu", "ecs", "2d"]
categories  = ["game-engines", "rendering", "wasm"]
rust-version = "1.95"
include     = [
    ".cargo/config.toml",
    "assets/fonts/**",
    "docs/CHANGELOG.md",
    "LICENSE",
    "README.md",
    "REFERENCE.html",
    "ARCHITECTURE.html",
    "Cargo.toml",
    "Cargo.lock",
    "examples/*.rs",
    "examples/games/**",
    "examples/wasm/build.sh",
    "examples/wasm/index.html",
    "scripts/**",
    "src/**",
]

[lib]
name = "engine"
crate-type = ["cdylib", "rlib"]

[[example]]
name = "centered_text"
path = "examples/centered_text/centered_text.rs"

[[example]]
name = "web_audio"
path = "examples/web_audio/web_audio.rs"

[[example]]
name = "wasm_save"
path = "examples/wasm_save/wasm_save.rs"

[[example]]
name = "platformer_game"
path = "examples/games/platformer/platformer.rs"

[[example]]
name = "scene_flow_game"
path = "examples/games/scene_flow/scene_flow.rs"

[[example]]
name = "maze_escape_game"
path = "examples/games/maze_escape/maze_escape.rs"

[[example]]
name = "sokoban_game"
path = "examples/games/sokoban/sokoban.rs"

[[example]]
name = "shooter_game"
path = "examples/games/shooter/shooter.rs"

[[example]]
name = "survivor_game"
path = "examples/games/survivor/survivor.rs"

[[example]]
name = "settings_menu_game"
path = "examples/games/settings_menu/settings_menu.rs"

[[example]]
name = "ui_layout_editor_game"
path = "examples/games/ui_layout_editor/ui_layout_editor.rs"

[[example]]
name = "stat_editor_game"
path = "examples/games/stat_editor_game/stat_editor.rs"

[[example]]
name = "lit_dungeon_game"
path = "examples/games/lit_dungeon/lit_dungeon.rs"

[[example]]
name = "coin_race_game"
path = "examples/games/coin_race/coin_race.rs"

[[example]]
name = "coin_race_server"
path = "examples/games/coin_race/server.rs"

[[example]]
name = "predict_shooter_server"
path = "examples/games/predict_shooter/server.rs"

[[example]]
name = "predict_shooter"
path = "examples/games/predict_shooter/predict_shooter.rs"

[[example]]
name = "orbital_dodger_server"
path = "examples/games/orbital_dodger/server.rs"

[[example]]
name = "orbital_dodger"
path = "examples/games/orbital_dodger/orbital_dodger.rs"

[[example]]
name = "salvage_run_server"
path = "examples/games/salvage_run/server.rs"

[[example]]
name = "salvage_run"
path = "examples/games/salvage_run/salvage_run.rs"

[[example]]
name = "script_steering_game"
path = "examples/games/script_steering/script_steering.rs"

[[example]]
name = "dig_quest_game"
path = "examples/games/dig_quest/dig_quest.rs"

[[example]]
name = "multi_terrain_game"
path = "examples/games/multi_terrain/multi_terrain.rs"

[[example]]
name = "data_anim_game"
path = "examples/games/data_anim/data_anim.rs"

[[example]]
