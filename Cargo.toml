[workspace]
members = [".", "engine_reflect_derive"]
resolver = "2"

[package]
name        = "skeleton-engine"
version     = "0.156.17"
edition     = "2021"
description = "Lightweight 2D game engine — wgpu rendering, custom ECS, rapier2d physics"
repository  = "https://github.com/ChunSam/skeleton-engine"
homepage    = "https://github.com/ChunSam/skeleton-engine"
documentation = "https://docs.rs/skeleton-engine"
readme      = "README.md"
license     = "MIT"
keywords    = ["game", "engine", "wgpu", "ecs", "2d"]
categories  = ["game-engines", "rendering", "wasm"]
rust-version = "1.95"
include     = [
    ".cargo/config.toml",
    "assets/fonts/**",
    "assets/hex_tiles.png",
    "docs/CHANGELOG.md",
    "LICENSE",
    "README.md",
    "Cargo.toml",
    "Cargo.lock",
    "scripts/**",
    "src/**",
]

[lib]
name = "engine"
crate-type = ["cdylib", "rlib"]

# Example games live at `examples/<name>/<name>.rs`, which Cargo does NOT auto-discover (it finds
# `examples/*.rs` and `examples/*/main.rs`), so each game declares its target here. The layout is
# the one settled in plans/2026-08-19-examples-rebuild-plan.md; `scripts/selftests.sh` reads these
# blocks to map a source file to its cargo target.
[[example]]
name = "platformer_game"
path = "examples/platformer_game/platformer_game.rs"

[[example]]
name = "rpg_quest_game"
path = "examples/rpg_quest_game/rpg_quest_game.rs"

[[example]]
name = "survivor_game"
path = "examples/survivor_game/survivor_game.rs"

[[example]]
name = "puzzle_grid_game"
path = "examples/puzzle_grid_game/puzzle_grid_game.rs"

[[example]]
name = "netplay_game"
path = "examples/netplay_game/netplay_game.rs"

# The sibling server. `netplay_game`'s selftest spawns this binary from its own `current_exe()`
# directory, so `scripts/selftests.sh` builds every `*_server` target it finds here — a name that
# does not end in `_server` would be missed and the live checks would fail as "server not built".
[[example]]
name = "netplay_server"
path = "examples/netplay_game/server.rs"

# ── Not a game ──────────────────────────────────────────────────────────────────────────────────
# `wasm_failpaths` is a browser harness that takes two failure paths on purpose. It is deliberately
# `main.rs` rather than `wasm_failpaths.rs`: `scripts/selftests.sh` defines a *game* as
# `examples/<name>/<name>.rs` and requires every game to carry a `<NAME>_SELFTEST`, and this has no
# native behaviour to test — both defects live in `#[cfg(target_arch = "wasm32")]` code, so a native
# selftest could only print a skip, and "a skip is not a pass". It is gated by
# `scripts/wasm_failpaths_web_smoke.sh` in the `wasm-smokes` CI job instead.
#
# The block is still needed even though Cargo auto-discovers `examples/*/main.rs`, because
# `scripts/build_wasm_examples.sh` derives its list from these blocks — without one, the page that
# exists only to run in a browser would never be checked to build for one.
[[example]]
name = "wasm_failpaths"
path = "examples/wasm_failpaths/main.rs"

[[example]]
name = "wasm_failpaths_echo_server"
path = "examples/wasm_failpaths/echo_server.rs"

[dependencies]
winit    = "0.30.13"
wgpu     = { version = "29", features = ["webgl"] }
glam     = { version = "0.28", features = ["serde"] }
bytemuck = { version = "1", features = ["derive"] }
image    = { version = "0.25", default-features = false, features = ["png"] }
log      = "0.4"
pollster = "0.3"
rand     = "0.8"
serde    = { version = "1", features = ["derive", "rc"] }
ron      = "0.8"
chacha20poly1305 = "0.10"
glyphon  = "0.11"
egui        = "0.34"
egui-wgpu   = "0.34"
egui-winit  = { version = "0.34", default-features = false }
rhai        = { version = "1", features = ["sync"] }

# `#[derive(Reflect)]` lives in the `engine_reflect_derive` workspace crate. It is a
# DEV-dependency (not a regular dep) so the published `skeleton-engine` crate does
# not require the unpublished proc-macro on crates.io — otherwise `cargo package`
# fails ("no matching package"). `tests/derive_reflect.rs` uses the derive directly via
# `engine_reflect_derive::Reflect`; downstream games add the crate to their own
# Cargo.toml the same way they add `engine`.
[dev-dependencies]
engine_reflect_derive = { path = "engine_reflect_derive" }
ab_glyph = "0.2" # egui's rasterizer — used to assert the bundled Korean subset font carries Hangul

# The games install this so the engine's `warn!`/`error!` sites are not discarded — see
# `examples/shared/logging.rs` for why a plain `env_logger::init()` would not have been enough.
# Native-only on purpose: on wasm `log` needs a browser sink this repo does not depend on, and the
# module documents that gap rather than pretending to close it.
#
# `default-features = false` is a measured choice, not a reflex. The three configurations were
# resolved and counted: defaults-off + `auto-color` + `humantime` pulls **21** new packages (the
# anstream family, plus jiff and defmt for timestamps), `auto-color` alone **15**, and bare
# defaults-off **6**. All three print the same thing where it matters —
# `[ERROR engine::input_script] …`, level and module included — so the extra 15 buy colour and a
# timestamp. Level directives (`RUST_LOG=warn`, `RUST_LOG=engine::audio=debug`) parse without any
# feature; only the optional `RUST_LOG=warn/pattern` message filter would need more.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
env_logger = { version = "0.11", default-features = false }

# ── 네이티브 전용 (OS API 의존) ──────────────────────────────────────────────
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rapier2d    = { version = "0.22", features = ["default"] }
rodio       = { version = "0.22", default-features = false, features = ["playback", "wav", "vorbis", "mp3"] }
dirs        = "5"
gilrs       = "0.11"
notify      = "6"
tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
rayon       = "1"

# macOS GameController.framework bindings — the engine's gamepad backend on macOS, where the
# IOKit-HID gilrs backend can't read modern Xbox/PS5 pads (Apple's GC driver claims them).
# Pinned to 0.2 to reuse the objc2 0.5 / objc2-foundation 0.2 already in the tree (winit/wgpu).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5"
objc2-foundation = { version = "0.2", features = ["NSArray", "NSEnumerator"] }
objc2-game-controller = { version = "0.2", features = [
    "GCController", "GCExtendedGamepad", "GCControllerButtonInput",
    "GCControllerAxisInput", "GCControllerDirectionPad", "GCControllerElement",
    "GCPhysicalInputProfile",
] }

# ── WASM 전용 ────────────────────────────────────────────────────────────────
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen          = "0.2"
wasm-bindgen-futures  = "0.4"
js-sys                = "0.3"
web-sys               = { version = "0.3", features = [
    "Window", "Performance", "HtmlCanvasElement", "Document", "Element",
    "WebSocket", "MessageEvent", "CloseEvent", "ErrorEvent", "BinaryType",
    "Response", "Headers", "Storage",
    "AudioContext", "AudioContextState", "BaseAudioContext", "AudioBuffer",
    "AudioBufferSourceNode", "AudioNode", "AudioDestinationNode", "GainNode", "AudioParam",
    "StereoPannerNode", "OscillatorNode", "OscillatorType",
    "BiquadFilterNode", "BiquadFilterType",
    "AnalyserNode",
] }
console_error_panic_hook = "0.1"
getrandom             = { version = "0.2", features = ["js"] }
web-time              = "1"
# getrandom 0.3 (wgpu 등 전이 의존성) — wasm_js 백엔드 명시
getrandom3            = { package = "getrandom", version = "0.3", features = ["wasm_js"] }

# ── wasm-pack 설정 ────────────────────────────────────────────────────────────
# macOS ._<file> 메타데이터 파일 오인식 문제로 wasm-opt 비활성화.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[package.metadata.wasm-pack.profile.dev]
wasm-opt = false

# ── 릴리즈 빌드 최적화 ────────────────────────────────────────────────────────
[profile.release]
opt-level     = 3
lto           = "thin"
codegen-units = 1
strip         = "symbols"
panic         = "abort"

# wasm 릴리즈: LTO + panic=abort 으로 바이너리 크기 최소화
[profile.release-wasm]
inherits      = "release"
opt-level     = "z"
lto           = true
codegen-units = 1
strip         = "symbols"
panic         = "abort"
