[workspace]
members = [".", "engine_reflect_derive"]
resolver = "2"

[package]
name        = "skeleton-engine"
version     = "0.153.2"
edition     = "2021"
description = "Lightweight 2D game engine — wgpu rendering, custom ECS, rapier2d physics"
repository  = "https://github.com/ChunSam/skeleton-engine"
homepage    = "https://github.com/ChunSam/skeleton-engine"
documentation = "https://docs.rs/skeleton-engine"
readme      = "README.md"
license     = "MIT"
keywords    = ["game", "engine", "wgpu", "ecs", "2d"]
categories  = ["game-engines", "rendering", "wasm"]
rust-version = "1.95"
include     = [
    ".cargo/config.toml",
    "assets/fonts/**",
    "assets/hex_tiles.png",
    "docs/CHANGELOG.md",
    "LICENSE",
    "README.md",
    "REFERENCE.html",
    "ARCHITECTURE.html",
    "Cargo.toml",
    "Cargo.lock",
    "scripts/**",
    "src/**",
]

[lib]
name = "engine"
crate-type = ["cdylib", "rlib"]

[dependencies]
winit    = "0.30.13"
wgpu     = { version = "29", features = ["webgl"] }
glam     = { version = "0.28", features = ["serde"] }
bytemuck = { version = "1", features = ["derive"] }
image    = { version = "0.25", default-features = false, features = ["png"] }
log      = "0.4"
pollster = "0.3"
rand     = "0.8"
serde    = { version = "1", features = ["derive", "rc"] }
ron      = "0.8"
chacha20poly1305 = "0.10"
glyphon  = "0.11"
egui        = "0.34"
egui-wgpu   = "0.34"
egui-winit  = { version = "0.34", default-features = false }
rhai        = { version = "1", features = ["sync"] }

# `#[derive(Reflect)]` lives in the `engine_reflect_derive` workspace crate. It is a
# DEV-dependency (not a regular dep) so the published `skeleton-engine` crate does
# not require the unpublished proc-macro on crates.io — otherwise `cargo package`
# fails ("no matching package"). `tests/derive_reflect.rs` uses the derive directly via
# `engine_reflect_derive::Reflect`; downstream games add the crate to their own
# Cargo.toml the same way they add `engine`.
[dev-dependencies]
engine_reflect_derive = { path = "engine_reflect_derive" }
ab_glyph = "0.2" # egui's rasterizer — used to assert the bundled Korean subset font carries Hangul

# ── 네이티브 전용 (OS API 의존) ──────────────────────────────────────────────
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rapier2d    = { version = "0.22", features = ["default"] }
rodio       = { version = "0.22", default-features = false, features = ["playback", "wav", "vorbis", "mp3"] }
dirs        = "5"
gilrs       = "0.11"
notify      = "6"
tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
rayon       = "1"

# macOS GameController.framework bindings — the engine's gamepad backend on macOS, where the
# IOKit-HID gilrs backend can't read modern Xbox/PS5 pads (Apple's GC driver claims them).
# Pinned to 0.2 to reuse the objc2 0.5 / objc2-foundation 0.2 already in the tree (winit/wgpu).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5"
objc2-foundation = { version = "0.2", features = ["NSArray", "NSEnumerator"] }
objc2-game-controller = { version = "0.2", features = [
    "GCController", "GCExtendedGamepad", "GCControllerButtonInput",
    "GCControllerAxisInput", "GCControllerDirectionPad", "GCControllerElement",
    "GCPhysicalInputProfile",
] }

# ── WASM 전용 ────────────────────────────────────────────────────────────────
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen          = "0.2"
wasm-bindgen-futures  = "0.4"
js-sys                = "0.3"
web-sys               = { version = "0.3", features = [
    "Window", "Performance", "HtmlCanvasElement", "Document", "Element",
    "WebSocket", "MessageEvent", "CloseEvent", "ErrorEvent", "BinaryType",
    "Response", "Headers", "Storage",
    "AudioContext", "AudioContextState", "BaseAudioContext", "AudioBuffer",
    "AudioBufferSourceNode", "AudioNode", "AudioDestinationNode", "GainNode", "AudioParam",
    "StereoPannerNode", "OscillatorNode", "OscillatorType",
    "BiquadFilterNode", "BiquadFilterType",
    "AnalyserNode",
] }
console_error_panic_hook = "0.1"
getrandom             = { version = "0.2", features = ["js"] }
web-time              = "1"
# getrandom 0.3 (wgpu 등 전이 의존성) — wasm_js 백엔드 명시
getrandom3            = { package = "getrandom", version = "0.3", features = ["wasm_js"] }

# ── wasm-pack 설정 ────────────────────────────────────────────────────────────
# macOS ._<file> 메타데이터 파일 오인식 문제로 wasm-opt 비활성화.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[package.metadata.wasm-pack.profile.dev]
wasm-opt = false

# ── 릴리즈 빌드 최적화 ────────────────────────────────────────────────────────
[profile.release]
opt-level     = 3
lto           = "thin"
codegen-units = 1
strip         = "symbols"
panic         = "abort"

# wasm 릴리즈: LTO + panic=abort 으로 바이너리 크기 최소화
[profile.release-wasm]
inherits      = "release"
opt-level     = "z"
lto           = true
codegen-units = 1
strip         = "symbols"
panic         = "abort"
